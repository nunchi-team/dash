<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Nunchi — вход</title>
<style>
:root{--fg:#141414;--muted:#6B6B6B;--bg:#fff;--line:#E4E2DE;--amber:#C8892B;--bad:#C0453B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
.wrap{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:380px}
.mark{font-size:52px;font-weight:900;letter-spacing:-.04em;line-height:1;margin:0}
.mark sup{font-size:18px;font-weight:700;vertical-align:top;margin-left:2px}
.tag{margin:8px 0 28px;color:var(--amber);font-size:18px;font-weight:600}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:8px}
input{width:100%;font-size:18px;padding:16px 18px;border:1.5px solid var(--line);border-radius:18px;outline:none;background:#fff;color:var(--fg)}
input:focus{border-color:var(--fg)}
button{width:100%;margin-top:14px;font-size:18px;font-weight:700;padding:16px;border:0;border-radius:18px;background:var(--fg);color:#fff;cursor:pointer}
button:disabled{opacity:.55}
.pw{position:relative}.pw input{padding-right:52px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:auto;margin:0;padding:10px;border:0;background:none;color:var(--muted);line-height:0;border-radius:12px}
.err{min-height:22px;margin-top:12px;color:var(--bad);font-size:15px}
.foot{margin-top:28px;color:var(--muted);font-size:13px}
</style></head>

<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var KEY = 'nunchi_pw', KK = 'nunchi_k';
  function b64(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  function tob64(buf){ var u = new Uint8Array(buf), s = ''; for (var i=0;i<u.length;i++) s += String.fromCharCode(u[i]); return btoa(s); }
  async function rawKey(pw){
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return crypto.subtle.deriveBits({name:'PBKDF2', salt:b64(P.s), iterations:P.n, hash:'SHA-256'}, base, 256);
  }
  async function openWith(raw){
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.i)}, key, b64(P.c));
    return new TextDecoder().decode(buf);
  }
  function show(html){ setTimeout(function(){ try{ if(document.getElementById('f')) fail('Не открылось — нажмите «Войти» ещё раз.'); }catch(e){} }, 8000); document.open(); document.write(html); document.close(); }
  var f = document.getElementById('f'), inp = document.getElementById('p'), btn = document.getElementById('b'), err = document.getElementById('e');
  function fail(msg){ btn.disabled = false; btn.textContent = 'Войти'; err.textContent = msg || ''; }
  var savedK = null, savedPw = null; try { savedK = localStorage.getItem(KK); savedPw = localStorage.getItem(KEY); } catch(e) {}
  async function auto(){
    // быстрый путь: сохранённый ключ — без долгого расчёта
    if (savedK) { try { return show(await openWith(b64(savedK))); } catch(e) { try { localStorage.removeItem(KK); } catch(x) {} } }
    if (savedPw) {
      try { var raw = await rawKey(savedPw), html = await openWith(raw); try { localStorage.setItem(KK, tob64(raw)); localStorage.removeItem(KEY); } catch(x) {} return show(html); }
      catch(e) { try { localStorage.removeItem(KEY); } catch(x) {} fail('Пароль сменился — введите новый.'); }
    }
  }
  if (savedK || savedPw) { btn.disabled = true; btn.textContent = 'Открываю…'; auto(); }
  document.getElementById('eye').addEventListener('click', function(){ var sh = inp.type === 'password'; inp.type = sh ? 'text' : 'password'; document.getElementById('slash').style.display = sh ? '' : 'none'; inp.focus(); });
  f.addEventListener('submit', function(ev){
    ev.preventDefault();
    var pw = inp.value.trim(); if (!pw) return;
    btn.disabled = true; btn.textContent = 'Открываю…'; err.textContent = '';
    rawKey(pw).then(function(raw){ return openWith(raw).then(function(html){ try { localStorage.setItem(KK, tob64(raw)); localStorage.removeItem(KEY); } catch(e) {} show(html); }); })
      .catch(function(){ fail('Неверный пароль'); inp.select(); });
  });
})();
</script>
